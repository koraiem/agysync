# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o bin/agysync-darwin-arm64 main.go || GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o bin/agysync-darwin-amd64 main.go || GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o bin/agysync-linux-amd64 main.go || GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o bin/agysync-linux-arm64 main.go || GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/agysync-windows-amd64.exe main.go

    - name: Test
      run: go test -v ./...
